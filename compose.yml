name: wow-paper-trader

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-bookworm
    env_file:
      - .env.postgres
    networks:
      - data
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
      
  migrator:
    env_file:
      - .env.postgres
    environment:
      DOTNET_ENVIRONMENT: Production
      #set cors to localhost to avoid startup errors, leave this in production
      Cors__AllowedOrigins__0: http://localhost
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        exec /app/efbundle \
          --connection "Host=postgres;Port=5432;Database=$${POSTGRES_DB};Username=$${POSTGRES_USER};Password=$${ADMIN_DB_PASSWORD}" \
          --no-color
      
    restart: "no"
    profiles:
      - jobs
    logging: *default-logging
  api:
    env_file:
      - .env.api
    networks:
      - proxy
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
      
      
  ingestor:
      env_file:
        - .env.ingestor
      networks:
        - data
      depends_on:
        postgres:
          condition: service_healthy
      command: 
        - auctions
      restart: "no"
      profiles:
        - jobs
      logging: *default-logging
       
  caddy:
    image: caddy:2
    env_file:
      - .env.caddy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    

networks:
  proxy:
  data:

volumes:
  postgres-data:
  caddy-data:
  caddy-config: